[pytest]
testpaths = tests
pythonpath = .
asyncio_mode = auto
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
addopts =
    -v
    --tb=short
    --strict-markers
    -p no:warnings
markers =
    unit: pure unit tests (no DB)
    integration: end-to-end tests via HTTP (needs PostgreSQL)