name: dentspace
description: DentSpace — dental care platform
publish_to: 'none'
version: 2.0.0

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # ─── State Management ───────────────────────────────────
  flutter_bloc: ^9.1.1
  equatable: ^3.0.0

  # ─── Functional Programming ─────────────────────────────
  dartz: ^0.10.1

  # ─── DI ─────────────────────────────────────────────────
  get_it: ^9.3.0
  injectable: ^3.0.0
  # ─── Local Cache ────────────────────────────────────────
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # ─── Models / Codegen ───────────────────────────────────
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0

  # ─── Network ────────────────────────────────────────────
  dio: ^5.7.0
  connectivity_plus: ^7.3.1

  # ─── Storage ────────────────────────────────────────────
  flutter_secure_storage: ^11.2.0
  shared_preferences: ^2.3.3

  # ─── Config ─────────────────────────────────────────────
  flutter_dotenv: ^6.0.1

  # ─── Routing ────────────────────────────────────────────
  go_router: ^18.0.1

  # ─── UI ─────────────────────────────────────────────────
  google_fonts: ^8.2.1
  cached_network_image: ^4.0.2
  shimmer: ^4.0.0
  flutter_animate: ^4.5.0
  lottie: ^3.1.3


  # ─── i18n ───────────────────────────────────────────────
  intl: ^0.20.2

  # ─── Firebase ───────────────────────────────────────────
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  flutter_local_notifications: ^22.3.1

  # ─── Media ──────────────────────────────────────────────
  image_picker: ^1.1.2

  # ─── Permissions ────────────────────────────────────────
  permission_handler: ^12.0.1

  # ─── Utilities ──────────────────────────────────────────
  logger: ^2.5.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # ─── Codegen ────────────────────────────────────────────
  build_runner: ^2.4.13
  freezed: ^3.2.6-dev.1
  json_serializable: ^6.9.0
  injectable_generator: ^3.1.3

  # ─── Testing ────────────────────────────────────────────
  mocktail: ^1.0.4
  bloc_test: ^10.0.0
flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/images/
    - assets/icons/
    - assets/animations/

  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
          weight: 400
        - asset: assets/fonts/Cairo-Medium.ttf
          weight: 500
        - asset: assets/fonts/Cairo-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700
        - asset: assets/fonts/Cairo-Black.ttf
          weight: 900

flutter_intl:
  enabled: true
  arb_dir: lib/core/localization/l10n
  output_dir: lib/core/localization/generated